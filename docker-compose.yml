# One-command dev stack:  docker compose up
#
#   postgres   :5432   the database
#   mailhog    :8025   dev SMTP UI (catch bulk emails, README §2.5); SMTP on :1025
#   backend    :8080   Node/TS API (only /health works out of the box)
#   frontend   :5173   React/Vite shell
#
# Secrets (Google OAuth) come from a local .env — copy .env.example to .env.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talentmatch
      POSTGRES_PASSWORD: talentmatch
      POSTGRES_DB: talentmatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://talentmatch:talentmatch@postgres:5432/talentmatch
      FRONTEND_URL: http://localhost:5173
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8080/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./sample-data:/sample-data:ro

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
